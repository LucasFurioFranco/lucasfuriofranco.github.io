<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <script src="/component/ws-gtm.js" defer></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style src="/static/global.css"></style>


        <title>LFF-Cart</title>
        
        <script src="/component/ws-footer.js" defer></script>
        <script src="/component/ws-header.js" defer></script>
        <script src="/component/ws-product-bundle.js" defer></script>

    </head>



    <body>
        <ws-header></ws-header>

        <main>
            <h1>LFF-Carrinho</h1>
            
            <div style="border: 1px solid #e1e4e8; border-radius: 6px; overflow: hidden; margin-top: 1rem;">

                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; padding: 10px 16px; background: #f1f8ff; font-weight: bold; font-size: 0.85rem; color: #586069; border-bottom: 1px solid #e1e4e8;">

                <!-- Linhas geradas pelos Web Components -->
                <ws-product-row name="Teclado Mecânico RGB" price="350.00" sku="TEC-01" category="Periféricos"></ws-product-row>
                <ws-product-row name="Mouse Sem Fio Ergonômico" price="180.00" sku="MOU-02" category="Periféricos"></ws-product-row>
                <ws-product-row name="Monitor Ultrawide 29''" price="1290.00" sku="MON-03" category="Monitores"></ws-product-row>
            </div>
        </main>

        <main data-type="LFF-TODO-ALTERAR">
            <h1>LFF-Blank</h1>
        </main>

        <ws-footer></ws-footer>
